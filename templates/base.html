<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Sakura House
        {% endblock %}
    </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header class="header">

    <div class="logo">
        <img src="{{ url_for('static', filename='images/sakura.jpg') }}"
             alt="Sakura House">
    </div>

    <nav class="nav">
    <a href="{{ url_for('order_history') }}">
    📦 Мої замовлення
</a>
    <a href="{{ url_for('main') }}">Головна</a>

    <a href="{{ url_for('menu') }}">Меню</a>

    <a href="{{ url_for('cart') }}">Корзина</a>

    {% if current_user.is_authenticated %}

        <a href="{{ url_for('profile') }}">Профіль</a>

        {% if current_user.username == "Admin" %}
            <a href="{{ url_for('admin') }}" class="admin-link">
                Адмін-панель
            </a>
        {% endif %}

    {% else %}

        <a href="{{ url_for('register') }}">Реєстрація</a>

        <a href="{{ url_for('login') }}">Вхід</a>

    {% endif %}

</nav>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
